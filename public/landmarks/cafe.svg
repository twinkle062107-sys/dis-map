<svg viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="240" rx="16" fill="#451a03"/>
  <!-- Cafe Brick Wall -->
  <rect x="50" y="50" width="300" height="170" rx="10" fill="#78350f"/>
  <!-- Warm Amber Glow Window -->
  <rect x="80" y="100" width="100" height="85" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="4"/>
  <line x1="130" y1="100" x2="130" y2="185" stroke="#b45309" stroke-width="3"/>
  <line x1="80" y1="142" x2="180" y2="142" stroke="#b45309" stroke-width="3"/>
  <!-- Fairy string lights -->
  <path d="M50 60 Q120 85 200 65 Q280 85 350 60" stroke="#fcd34d" stroke-width="2" fill="none"/>
  <circle cx="90" cy="72" r="5" fill="#fef08a"/>
  <circle cx="150" cy="77" r="5" fill="#fef08a"/>
  <circle cx="210" cy="68" r="5" fill="#fef08a"/>
  <circle cx="270" cy="78" r="5" fill="#fef08a"/>
  <circle cx="320" cy="68" r="5" fill="#fef08a"/>
  <!-- Hanging Signboard -->
  <rect x="220" y="80" width="110" height="45" rx="6" fill="#b45309" stroke="#f59e0b" stroke-width="3"/>
  <text x="275" y="102" font-family="sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">CAFE AROMA</text>
  <text x="275" y="117" font-family="sans-serif" font-weight="700" font-size="10" fill="#fef3c7" text-anchor="middle">☕ FRESH BREW</text>
  <!-- Wooden Door -->
  <rect x="235" y="135" width="80" height="85" rx="4" fill="#92400e" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="247" cy="175" r="4" fill="#fef08a"/>
</svg>

<svg viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="240" rx="16" fill="#713f12"/>
  <!-- Bright Yellow ATM kiosk -->
  <rect x="110" y="45" width="180" height="175" rx="14" fill="#facc15" stroke="#eab308" stroke-width="4"/>
  <!-- Top header -->
  <rect x="125" y="60" width="150" height="35" rx="8" fill="#1e293b"/>
  <text x="200" y="84" font-family="sans-serif" font-weight="900" font-size="18" fill="#facc15" text-anchor="middle" letter-spacing="2">24/7 ATM</text>
  <!-- Screen -->
  <rect x="135" y="110" width="130" height="50" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>
  <text x="200" y="140" font-family="sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle">WELCOME / INSERT CARD</text>
  <!-- Card slot and keypad -->
  <rect x="145" y="172" width="50" height="8" rx="2" fill="#334155"/>
  <rect x="210" y="170" width="50" height="25" rx="3" fill="#475569"/>
  <!-- Glow effect indicator -->
  <circle cx="280" cy="55" r="8" fill="#22c55e"/>
</svg>

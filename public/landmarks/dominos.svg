<svg viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="240" rx="16" fill="#450a0a"/>
  <!-- Domino's Billboard Wall -->
  <rect x="50" y="40" width="300" height="160" rx="12" fill="#dc2626" stroke="#b91c1c" stroke-width="4"/>
  <!-- Angled Domino Tile -->
  <g transform="translate(110, 80) rotate(-15)">
    <rect x="-30" y="-30" width="30" height="60" rx="6" fill="#ef4444" stroke="#ffffff" stroke-width="3"/>
    <circle cx="-15" cy="-15" r="5" fill="#ffffff"/>
    <rect x="0" y="-30" width="30" height="60" rx="6" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
    <circle cx="15" cy="-15" r="4" fill="#ffffff"/>
    <circle cx="15" cy="15" r="4" fill="#ffffff"/>
  </g>
  <!-- Text Brand -->
  <text x="235" y="115" font-family="sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="1">Domino's</text>
  <rect x="175" y="130" width="120" height="24" rx="12" fill="#1e3a8a"/>
  <text x="235" y="146" font-family="sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="2">PIZZA CORNER</text>
</svg>
